name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-ci:
    name: test:ci / ${{ matrix.lane }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GIT_AUTHOR_NAME: senti CI
      GIT_AUTHOR_EMAIL: senti-ci@example.invalid
      GIT_COMMITTER_NAME: senti CI
      GIT_COMMITTER_EMAIL: senti-ci@example.invalid
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: minimum
            node-version: "18.19.0"
          - lane: current-lts
            node-version: "lts/*"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm run test:ci

  required:
    name: Required CI
    runs-on: ubuntu-latest
    needs: test-ci
    if: always()
    steps:
      - name: Verify Node matrix
        env:
          MATRIX_RESULT: ${{ needs.test-ci.result }}
        run: test "$MATRIX_RESULT" = "success"
